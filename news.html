<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Romanian news feed — verified articles" name="description"/>
    <meta content="Mihai Dornescu" name="author"/>
    <link href="src/img/favicon/favicon.ico" rel="shortcut icon">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@300;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Markdown renderer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <title>News Feed</title>
    <style>
        body { font-family: 'Dosis', sans-serif; }

        @keyframes anim-left {
            0%   { opacity: 0; transform: translateX(-100px); }
            50%  { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .show    { display: block; animation: anim-left .2s ease-in-out; position: absolute; z-index: 1000; }
        .sidebar { display: none; }

        /* modal */
        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 1050;
            left: 0; top: 0;
            width: 100%; height: 100%;
            overflow: auto;
            background: rgba(0,0,0,0.4);
        }
        .modal-box {
            background: #fff;
            margin: 5% auto;
            padding: 1.5rem;
            border: 1px solid #ccc;
            width: 92%;
            max-width: 780px;
            border-radius: 4px;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-close {
            position: absolute;
            top: 0.75rem; right: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            background: none;
            border: none;
            line-height: 1;
        }
        .modal-close:hover { color: #333; }

        .news-row:hover { background-color: #f8f9fa; }
        .article-body img { max-width: 100%; height: auto; }
        .article-body pre { background: #f8f9fa; padding: .75rem; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>

<main class="position-relative">
    <!-- navbar -->
    <nav class="position-relative pb-5">
        <ul class="d-flex justify-content-between align-items-center py-3 px-3 fixed-top bg-white border-bottom list-unstyled mb-0 shadow-sm">
            <li>
                <div class="d-flex align-items-center">
                    <a class="d-flex align-items-center" href="index.html">
                        <img alt="home button" src="./src/img/svg/home.svg">
                    </a>
                    <a class="fs-5 ps-3 text-dark text-decoration-none" href="javascript:" itemprop="author">
                        Mihai Dornescu
                    </a>
                </div>
            </li>
            <li>
                <button id="access-sidebar" class="btn btn-link p-0">
                    <img alt="hamburger menu" src="./src/img/svg/hamburger.svg">
                </button>
            </li>
        </ul>
    </nav>

    <!-- sidebar -->
    <div class="position-relative">
        <aside class="position-fixed top-0 start-0 h-100 sidebar" id="sidebar" style="z-index: 1040;"></aside>
    </div>

    <div class="container">
        <!-- hero -->
        <section class="text-center py-4">
            <p class="py-2 fs-4 text-secondary">News Feed</p>
            <p class="text-secondary small">Verified articles — Romanian news</p>
        </section>

        <!-- category filters -->
        <div id="cat-filters" class="d-flex flex-wrap gap-2 mb-3"></div>

        <!-- articles -->
        <ol class="list-unstyled border rounded" id="news-list"></ol>

        <!-- article modal -->
        <div class="modal-overlay" id="articleModal">
            <div class="modal-box">
                <button class="modal-close" onclick="closeArticleModal()">&times;</button>
                <div id="articleContent"></div>
            </div>
        </div>

        <!-- pagination -->
        <div class="d-flex flex-wrap gap-1 align-items-center my-3" id="pagination"></div>
    </div>
</main>

<footer id="footer">
    <div class="container">
        <ul class="d-flex ps-2 py-3 list-unstyled mb-0">
            <li class="p-1">
                <div id="footer-year"></div>
            </li>
            <li class="p-1 d-flex justify-content-center align-items-center">
                <a href="https://github.com/dornescum" rel="noopener" target="_blank">
                    <img alt="github" src="./src/img/svg/github.svg">
                </a>
            </li>
            <li class="p-1 d-flex justify-content-center align-items-center">
                <a href="https://www.linkedin.com/in/mihai-dornescu-21b35a94/" rel="noopener" target="_blank">
                    <img alt="linkedin" src="./src/img/svg/linkedIn.svg">
                </a>
            </li>
            <li class="p-1 d-flex justify-content-center align-items-center">
                <a href="https://dornescu.ro/" rel="noopener" target="_blank">
                    <img alt="dornescu.ro" src="./src/img/svg/blog.svg">
                </a>
            </li>
        </ul>
    </div>
</footer>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- sidebar + footer year -->
<script type="module">
    import { handleSidebar } from './src/js/utils/handleSidebar.js';
    import { YEAR }          from './src/js/utils/footerYear.js';
    handleSidebar(document.getElementById('access-sidebar'), document.getElementById('sidebar'));
    document.getElementById('footer-year').innerHTML = `<p>&copy; ${YEAR}</p>`;
</script>
<!-- news feed -->
<script src="src/js/news.js" type="module"></script>

</body>
</html>
