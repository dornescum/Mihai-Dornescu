    <meta charset="UTF-8">

    <meta content="Junior developer, Javascript, React js, Next js, Angular, Express js, Node js" name="description"/>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Playground</title>
    <style>
        body { font-family: 'Dosis', sans-serif; }

        .loading {
            display: grid;
            justify-content: center;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #f0f4f8;
            padding-top: 5rem;
            z-index: 999;
        }
        .hide-loading { display: none; }

        @keyframes anim-left {
            0%   { opacity: 0; transform: translateX(-100px); }
            50%  { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .show {
            display: block;
            animation: anim-left .2s ease-in-out;
            position: absolute;
            z-index: 1000;
        }
        .sidebar { display: none; }

        /* modal */
        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 1050;
            left: 0; top: 0;
            width: 100%; height: 100%;
            overflow: auto;
            background: rgba(0,0,0,0.4);
        }
        .modal-box {
            background: #fff;
            margin: 10% auto;
            padding: 1.5rem;
            border: 1px solid #ccc;
            width: 90%;
            max-width: 680px;
            border-radius: 4px;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 0.75rem; right: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            background: none;
            border: none;
            line-height: 1;
        }
        .modal-close:hover { color: #333; }

        /* project list row hover – show info button */
        .project-row .info-btn { opacity: 0; transition: opacity 0.15s; }
        .project-row:hover .info-btn { opacity: 1; }
        .project-row:hover { background-color: #f8f9fa; }
    </style>
</head>
<body>

<main class="position-relative">
    <!-- navbar -->
    <nav class="position-relative pb-5">
        <ul class="d-flex justify-content-between align-items-center py-3 px-3 fixed-top bg-white border-bottom list-unstyled mb-0 shadow-sm">
            <li>
                <div class="d-flex align-items-center">
                    <a class="d-flex align-items-center" href="index.html">
                        <img alt="home button" src="./src/img/svg/home.svg">
                    </a>
                    <a class="fs-5 ps-3 text-dark text-decoration-none" href="javascript:" itemprop="author">
                        Mihai Dornescu
                    </a>
                </div>
            </li>
            <li>
                <button id="access-sidebar" class="btn btn-link p-0">
                    <img alt="hamburger menu" src="./src/img/svg/hamburger.svg">
                </button>
            </li>
        </ul>
    </nav>

    <!-- sidebar -->
    <div class="position-relative">
        <aside class="position-fixed top-0 start-0 h-100 sidebar" id="sidebar" style="z-index: 1040;"></aside>
    </div>

    <div class="container">
    <!-- hero -->
    <section class="text-center py-4" id="hero">
        <p class="py-3 fs-4 text-secondary">My playground</p>
        <p class="text-center text-secondary">
            The place where I test different technologies or frameworks.
        </p>
    </section>

    <!-- loading -->
    <section class="loading">
        <h1 class="text-secondary">Loading...</h1>
    </section>

    <!-- projects -->
    <section class="my-3" data-testid="projects" id="nest-projects">
        <div id="tag-filters" class="d-flex flex-wrap gap-2 mb-3"></div>
        <ol class="list-unstyled border rounded" data-testid="projects-nest" id="grid-projects"></ol>
    </section>

    <!-- modal -->
    <div class="modal-overlay" id="myModal">
        <div class="modal-box" id="modalContent">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="modalDescription"></div>
        </div>
    </div>

    <!-- pagination -->
    <section class="my-3">
        <div class="d-flex flex-wrap gap-1 align-items-center" id="pagination"></div>
    </section>

    <!-- cookie consent -->
    <div class="cookie-container bg-light d-none py-4 position-relative" style="z-index: 10;">
        <p class="text-secondary px-4 py-2" id="cookie">
            We use cookies in this website to give you the best experience on our
            site and show you relevant ads. To find out more, read our
            <a href="#">privacy policy</a> and <a href="#">cookie policy</a>.
        </p>
        <button class="cookie-btn btn btn-link p-1 position-absolute top-0 end-0">
            <img alt="close btn" src="./src/img/svg/close.svg">
        </button>
    </div>
    </div><!-- /container -->
</main>

  <div class="container">

        </li>
        <li class="p-1 d-flex justify-content-center align-items-center">
            <a href="contact.html" itemprop="author">
                <img alt="dornescu.ro" src="./src/img/svg/contact.svg">
            </a>
        </li>
    </ul>
  </div><!-- /container -->
</footer>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="src/js/index.js" type="module"></script>

</body>
</html>
