<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="src/img/favicon/favicon.ico" rel="shortcut icon">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@300;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Visitor Analytics</title>
    <style>
        body { font-family: 'Dosis', sans-serif; background: #f8f9fa; }

        .page-header {
            background: #212529;
            color: #fff;
            padding: 1.25rem 1.5rem;
        }
        .page-header h1 { font-weight: 800; font-size: 1.6rem; margin: 0; }
        .page-header small { font-weight: 300; opacity: .7; }

        .stat-card {
            background: #fff;
            border-radius: .5rem;
            box-shadow: 0 1px 6px rgba(0,0,0,.08);
            padding: 1.25rem 1.5rem;
            text-align: center;
        }
        .stat-card .value { font-size: 2.5rem; font-weight: 800; line-height: 1; }
        .stat-card .label { font-size: .85rem; font-weight: 300; color: #6c757d; margin-top: .25rem; }

        .section-card {
            background: #fff;
            border-radius: .5rem;
            box-shadow: 0 1px 6px rgba(0,0,0,.08);
            overflow: hidden;
        }
        .section-card .card-title {
            background: #212529;
            color: #fff;
            font-weight: 600;
            font-size: .9rem;
            padding: .6rem 1rem;
            margin: 0;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        table { font-size: .875rem; margin-bottom: 0; }
        thead th {
            background: #343a40;
            color: #adb5bd;
            font-weight: 600;
            font-size: .75rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            border: none;
            padding: .5rem .75rem;
        }
        tbody tr:hover { background: #f1f3f5; }
        td { vertical-align: middle; padding: .45rem .75rem; }

        .bar-cell { min-width: 100px; }
        .bar-track {
            background: #e9ecef;
            border-radius: 3px;
            height: 6px;
            overflow: hidden;
        }
        .bar-fill {
            background: #495057;
            height: 100%;
            border-radius: 3px;
            transition: width .3s ease;
        }

        .truncate-cell {
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #status-bar { font-size: .8rem; }
        #refresh-btn { font-weight: 600; }
        #loading, #error-state { display: none; }
    </style>
</head>
<body>

<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <h1>Visitor Analytics</h1>
        <small id="status-bar">–</small>
    </div>
    <div class="d-flex gap-2">
        <a href="index.html" class="btn btn-outline-light btn-sm">← Home</a>
        <button id="refresh-btn" class="btn btn-outline-light btn-sm">↻ Refresh</button>
    </div>
</div>

<div class="container-fluid py-4">

    <div id="loading" class="text-center py-5 text-muted">
        <div class="spinner-border spinner-border-sm me-2" role="status"></div>
        Loading…
    </div>

    <div id="error-state" class="alert alert-danger" role="alert"></div>

    <div id="dashboard">
        <!-- total -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="value" id="stat-total">–</div>
                    <div class="label">Total Visits</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="value" id="stat-websites">–</div>
                    <div class="label">Websites</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="value" id="stat-pages">–</div>
                    <div class="label">Unique Pages</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="value" id="stat-languages">–</div>
                    <div class="label">Languages</div>
                </div>
            </div>
        </div>

        <!-- breakdown tables -->
        <div class="row g-3">
            <div class="col-12 col-md-6 col-xl-4">
                <div class="section-card">
                    <div class="card-title">By Website</div>
                    <div id="tbl-websites"></div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-xl-4">
                <div class="section-card">
                    <div class="card-title">By Page</div>
                    <div id="tbl-pages"></div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-xl-4">
                <div class="section-card">
                    <div class="card-title">By Date</div>
                    <div id="tbl-dates"></div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-xl-6">
                <div class="section-card">
                    <div class="card-title">Top Referrers</div>
                    <div id="tbl-referrers"></div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-xl-6">
                <div class="section-card">
                    <div class="card-title">Top Languages</div>
                    <div id="tbl-languages"></div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-xl-4">
                <div class="section-card">
                    <div class="card-title">Top Screens</div>
                    <div id="tbl-screens"></div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-xl-4">
                <div class="section-card">
                    <div class="card-title">Top Timezones</div>
                    <div id="tbl-timezones"></div>
                </div>
            </div>
            <div class="col-12 col-xl-4">
                <div class="section-card">
                    <div class="card-title">Top User Agents</div>
                    <div id="tbl-useragents"></div>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
// const ENDPOINT = 'https://news.93-115-17-160.nip.io/v1/visitors';
const ENDPOINT = 'https://stiri.digital/v1/visitors';

async function loadVisitors() {
    const loading   = document.getElementById('loading');
    const errorEl   = document.getElementById('error-state');
    const dashboard = document.getElementById('dashboard');
    const statusBar = document.getElementById('status-bar');

    loading.style.display = 'block';
    errorEl.style.display = 'none';
    dashboard.style.visibility = 'hidden';
    statusBar.textContent = 'Fetching…';

    try {
        const res = await fetch(ENDPOINT);
        if (!res.ok) throw new Error(`HTTP ${res.status} – ${res.statusText}`);
        const d = await res.json();

        // stat cards
        set('stat-total',     d.total ?? 0);
        set('stat-websites',  (d.by_website  ?? []).length);
        set('stat-pages',     (d.by_page     ?? []).length);
        set('stat-languages', (d.top_languages ?? []).length);

        // breakdown tables
        renderTable('tbl-websites',   d.by_website,      'Website',    'label', 'count', d.total);
        renderTable('tbl-pages',      d.by_page,         'Page',       'label', 'count', d.total);
        renderTable('tbl-dates',      d.by_date,         'Date',       'date',  'count', d.total);
        renderTable('tbl-referrers',  d.top_referrers,   'Referrer',   'label', 'count', d.total);
        renderTable('tbl-languages',  d.top_languages,   'Language',   'label', 'count', d.total);
        renderTable('tbl-screens',    d.top_screens,     'Screen',     'label', 'count', d.total);
        renderTable('tbl-timezones',  d.top_timezones,   'Timezone',   'label', 'count', d.total);
        renderTable('tbl-useragents', d.top_user_agents, 'User Agent', 'label', 'count', d.total, true);

        loading.style.display = 'none';
        dashboard.style.visibility = 'visible';
        statusBar.textContent = `Last fetched: ${new Date().toLocaleTimeString()}`;

    } catch (err) {
        loading.style.display = 'none';
        errorEl.textContent = `Failed to load data: ${err.message}`;
        errorEl.style.display = 'block';
        statusBar.textContent = 'Error';
    }
}

function renderTable(containerId, rows, labelHeader, labelKey, countKey, total, truncate = false) {
    const container = document.getElementById(containerId);
    const filtered  = (rows ?? []).filter(r => r[labelKey] != null && r[labelKey] !== '');
    if (filtered.length === 0) {
        container.innerHTML = '<p class="text-muted px-3 py-2 mb-0" style="font-size:.85rem">No data</p>';
        return;
    }
    const max = Math.max(...filtered.map(r => r[countKey] ?? 0));
    const labelClass = truncate ? ' class="truncate-cell"' : '';
    let html = `<table class="table table-hover">
        <thead><tr>
            <th>${esc(labelHeader)}</th>
            <th class="text-end">Visits</th>
            <th class="text-end">%</th>
            <th class="bar-cell"></th>
        </tr></thead><tbody>`;

    for (const r of filtered) {
        const cnt   = r[countKey] ?? 0;
        const pct   = total ? ((cnt / total) * 100).toFixed(1) : '–';
        const bar   = max ? Math.round((cnt / max) * 100) : 0;
        const label = esc(String(r[labelKey]));
        const cell  = truncate
            ? `<td${labelClass} title="${label}">${label}</td>`
            : `<td>${label}</td>`;
        html += `<tr>
            ${cell}
            <td class="text-end fw-bold">${cnt}</td>
            <td class="text-end text-muted">${pct}%</td>
            <td class="bar-cell">
                <div class="bar-track"><div class="bar-fill" style="width:${bar}%"></div></div>
            </td>
        </tr>`;
    }
    html += '</tbody></table>';
    container.innerHTML = html;
}

function set(id, val) { document.getElementById(id).textContent = val; }

function esc(str) {
    return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

document.getElementById('refresh-btn').addEventListener('click', loadVisitors);
loadVisitors();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
